spring.application.name=Google-Text-Editor
logging.level.Computer.Engineering.Google.Text.Editor.model=DEBUG
server.port=8080
spring.main.allow-bean-definition-overriding=true

spring.datasource.url=jdbc:sqlserver://SALMA_NASSER\\SQLEXPRESS;databaseName=TextEditor;integratedSecurity=true

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect